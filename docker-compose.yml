services:
  elasticsearch:
    container_name: elastic-container
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.5.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    networks:
      - ek-net
    ports:
      - 9200:9200
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
  kibana:
    container_name: kibana-container
    image: docker.elastic.co/kibana/kibana-wolfi:9.5.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-container:9200
    networks:
      - ek-net
    depends_on:
      - elasticsearch
    ports:
      - 5601:5601


networks:
  ek-net:
    driver: bridge
